[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codetre"
version = "0.1.0"
description = "AST-based code structure outline tool — generate hierarchical symbol maps with call relationships"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "wenxin" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["code-analysis", "ast", "code-structure", "outline", "call-graph"]
dependencies = ["pathspec>=0.12"]

[project.urls]
Repository = "https://github.com/2315137135/codetre"
BugTracker = "https://github.com/2315137135/codetre/issues"

[project.scripts]
codetre = "codetre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
